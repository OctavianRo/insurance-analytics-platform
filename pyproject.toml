[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-analytics-platform"
version = "0.1.0"
description = "Reproducible life and health insurance analytics on synthetic data"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "dash>=3,<5", "plotly>=5.24,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
ml = ["xgboost>=3,<4", "mlflow>=3.18,<4", "metaflow>=2.13,<3", "evidently>=0.7,<1"]
cloud = ["boto3>=1.35,<2"]
snowflake = ["snowflake-connector-python>=3,<5"]

[project.scripts]
insurance-analytics = "insurance_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
